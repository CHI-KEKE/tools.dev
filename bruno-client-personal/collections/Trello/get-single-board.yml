info:
  name: get-single-board
  type: http
  seq: 3

http:
  method: GET
  url: "{{base-url}}/1/boards/{{boardNumber}}?key={{key}}&token={{token}}"
  params:
    - name: key
      value: "{{key}}"
      type: query
    - name: token
      value: "{{token}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        pm.test("Status code is 200", function () {
            pm.response.to.have.status(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
