opencollection: 1.0.0

info:
  name: QFPay
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-QF-APPCODE
      value: "{{APP_CODE}}"
    - name: X-QF-SIGN
      value: "{{SIGNATURE}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
