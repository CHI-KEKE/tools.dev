info:
  name: refund
  type: http
  seq: 3

http:
  method: POST
  url: "{{base-url}}/trade/v1/refund"
  body:
    type: form-urlencoded
    data:
      - name: syssn
        value: "{{SYSSN}}"
      - name: mchid
        value: "{{MCHID}}"
      - name: txamt
        value: "{{TXAMT}}"
      - name: out_trade_no
        value: "{{OUTTRADENO}}"
      - name: txdtm
        value: "{{TXDTM}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## pm prescript

  const crypto = require('crypto-js');

  const app_code = '*******'
  const client_key = '*******'

  const syssn = '202006230500010979'
  const txamt = '1'
  const mchid = '*******'
  const out_trade_no = String(Math.round(Math.random() * 1000000000))
  const txdtm = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '')
  const auth_code = ''

  var payload = {
    'syssn': syssn,
    'txamt': txamt,
    'mchid': mchid,
    'out_trade_no': out_trade_no,
    'txdtm': txdtm
  };

  // Signature Generation
  const ordered = {};
  Object.keys(payload).sort().forEach(function (key) {
    ordered[key] = payload[key]
  });
  console.log(ordered)

  var str = [];
  for (var p in ordered)
    if (ordered.hasOwnProperty(p)) {
      str.push((p) + "=" + (ordered[p]));
    }
  var string = str.join("&") + client_key;
  console.log(string)

  var hashed = crypto.MD5(string, client_key)
  console.log(hashed)

  postman.setEnvironmentVariable("SIGNATURE", hashed)
  postman.setEnvironmentVariable("APP_CODE", app_code)
  postman.setEnvironmentVariable("MCHID", mchid)
  postman.setEnvironmentVariable("TXAMT", txamt)
  postman.setEnvironmentVariable("OUTTRADENO", out_trade_no)
  postman.setEnvironmentVariable("TXDTM", txdtm)
