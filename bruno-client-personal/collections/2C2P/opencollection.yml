    先把 request payload 用 HS256 + secretKey 簽成 JWT
    再送到 2C2P API：
    POST /payment/4.1/paymentToken
    POST /payment/4.3/paymentInquiry
    body 格式都是：

    {
      "payload": "<JWT>"
