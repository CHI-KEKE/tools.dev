<!--
元件：有機自然風 + 毛玻璃卡片（organic-glass-style）
用途：品牌／自然／生態／永續主題的裝飾性排版，或想要跳脫「病歷表/時間軸」資訊語意、改走輕盈品牌感的文章
這是一種「視覺風格」（配色/字體/質感），不是固定的排版公式，同一篇文章內仍要依內容的性質選擇對的呈現方式，不要不管內容形態一律套卡片網格：
  - 內容彼此獨立、沒有先後順序（分類、並列方案、對照組）→ 用 earth-card-grid
  - 內容有明確先後順序、講的是一個隨時間演進的流程（步驟 1 導致步驟 2、事件時序）→ 用 earth-step-flow 或 earth-line-steps，不要硬拆成並排的卡片網格，那樣會讓讀者誤以為每張卡是互相獨立、可以任意排序的並列項目
包含五種可獨立使用、也可在同一篇文章內搭配的區塊：
  1. organic-hero：大標題橫幅（開場區塊，深綠漸層底 + 散落葉片裝飾）
  2. glass-feature-row：毛玻璃感的橫向特色列（圖示 + 標題 + 說明，適合並列比較 2-4 個概念，項目之間可用 gf-arrow 表示轉換關係）
  3. earth-card-grid：大地色塊卡片網格（每張卡各自一種自然色，適合條列彼此獨立的分類/方案，不適合表達有先後順序的流程）
  4. earth-step-flow：大地色塊步驟流程（同樣的自然色塊質感，但改成上下堆疊＋中間箭頭連接，用於表達有先後順序的步驟/流程/時序，視覺較重）
  5. earth-line-steps：極簡編號時間軸（左側一條直線貫穿＋圓圈編號，標題用自然色系螢光筆畫記，虛線連到右側說明文字；視覺較輕盈，適合條列較多步驟時避免頁面太重）
配色語意（跟 writing-rules.md 第 4 點的「危險/警示/成功」語意不同）：
  這套是「自然分類」裝飾語意，不代表風險程度 → leaf(綠)=核心重點、clay(棕)=次要對照、sand(沙金)=補充延伸
  只適合品牌/科普/知識類的裝飾性內容，若文章情境是事件回顧/故障排查等需要清楚危險分級，仍應改用 vertical-timeline 等既有元件的紅/琥珀/綠語意
-->

.glass-feature-row { display:flex; flex-wrap:wrap; gap:18px; background:linear-gradient(135deg, rgba(47,74,62,.92), rgba(63,92,71,.9)); border-radius:14px; padding:24px 26px; margin:18px 0 28px; }
