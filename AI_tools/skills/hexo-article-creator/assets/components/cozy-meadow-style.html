<!--
元件：療癒插畫風（cozy-meadow-style）
來源：取材自療癒系插畫截圖 aaa01_2.png（草地上曬太陽的棕熊與白色小熊，扁平色塊 + 手繪筆刷質感，大地棕／草地綠／奶白配色，黑色線條五官與腳掌）
用途：生活隨筆、放鬆／休息主題、寵物或角色類內容、輕鬆自在氛圍的文章開場與並列說明，想要跳脫「病歷表/終端機」冷硬感、改走可愛療癒感的文章
這是一種「視覺風格」（配色/字體/質感），不是固定排版公式，仍要依內容形態選用對的區塊：
  - 內容彼此獨立、沒有先後順序（並列的主題/心得/清單）→ 用 cozy-card-grid
  - 內容有明確先後順序的步驟／流程（一步接一步的操作或時序）→ 用 cozy-line-steps
包含五種可獨立使用、也可在同一篇文章內搭配的區塊：
  1. cozy-hero：開場大標題橫幅（草地綠漸層底 + 手繪筆刷紋理感 + 散落小花與一隻小熊點綴，模擬截圖裡的草地質感）
  2. cozy-feature-row：橫向並列的重點特色列（圓形圖示 + 標題 + 說明，奶白底卡片，圖示預設用熊掌 🐾，適合並列比較 2-3 個概念）
  3. cozy-card-grid：大地色塊卡片網格（棕熊色/奶白/苔綠三種色塊，圓角偏大帶「毛絨感」，徽章可用數字或直接換成 🐻／🐾／🌿 圖示，適合條列彼此獨立的心得/重點/分類）
  4. cozy-line-steps：極簡編號時間軸（左側直線＋圓形編號徽章，標題旁綴小花／腳印圖示，虛線接右側說明，適合條列步驟且想保持輕盈感）
  5. cozy-bear-divider：小熊分隔線（一隻小熊 emoji 置中＋左右兩條漸層細線，用於長文章裡分隔兩個大段落，比再放一次 hero 更輕量，純裝飾不帶文字）
配色語意（跟 writing-rules.md 第 4 點的「危險/警示/成功」語意不同）：
  這套是「溫暖分類」裝飾語意，不代表風險程度 → bear(棕熊色)=核心重點、cream(奶白)=中性補充、moss(苔綠)=延伸資訊
  只適合生活/心得/輕鬆主題的裝飾性內容，若文章情境是事件回顧/故障排查等需要清楚危險分級，仍應改用 vertical-timeline/medical-chart 等既有元件的紅/琥珀/綠語意；若是品牌/自然/永續主題則優先用 organic-glass-style（該套走「深綠漸層＋大地色塊」的品牌質感，這套走「淺草地＋圓潤插畫」的生活療癒感，兩者可依情境擇一，不建議混用在同一篇文章）
-->
