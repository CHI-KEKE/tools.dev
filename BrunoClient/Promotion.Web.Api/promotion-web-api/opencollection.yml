opencollection: 1.0.0

info:
  name: promotion-web-api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: N1-SHOP-ID
      value: "{{shopId}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
