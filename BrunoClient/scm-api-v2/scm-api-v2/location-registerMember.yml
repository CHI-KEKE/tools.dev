    data: |-
      {
        "ShopId": 83,
        "CellPhone": "+6598505280",
        "RegisterSourceType": "Web",
        "RegisterDevice": "Chrome",
        "AppVersion": "1.2.3",
        "LocationId": 12,
        "LocationEmployeeId": 345,
        "MemberId": 123,
        "CountryCode": "65",
        "CountryProfileId": 35,
        "IsNotSendSmsAfterRegister": false,
        "IsUseRandomPassword": true,
        "RegisteredDateTime": "2025-12-11T16:20:00",
        "VipMemberId": 123,
        "IsOpen": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
