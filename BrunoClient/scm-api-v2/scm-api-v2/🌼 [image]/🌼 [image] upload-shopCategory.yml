http:
  method: POST
  url: "{{base-url}}/SCM/V2/Image/UploadShopCategoryImage?t={{token}}&ts={{timestamp}}&s={{signature}}"
  params:
    - name: t
      value: "{{token}}"
      type: query
    - name: ts
      value: "{{timestamp}}"
      type: query
    - name: s
      value: "{{signature}}"
      type: query
  body:
    type: multipart-form
    data:
      - name: Id
        type: text
        value: "3144"
      - name: ShopId
        type: text
        value: "2"
      - name: Image
        type: file
        value:
          - C:\Users\Allen Lin\Desktop\pics\300X300\rsz_di.png
      - name: data
        type: text
        value: '{"Id":3144,"ShopId":2,"Image":null}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

