  ## pm

  // 取得Timestamp
  let timestamp = getTimestamp();

  // 取得Signature
  const signatureApiUrl = pm.collectionVariables.get("API_URL") + "/scm/v1/Sample/GetEncryptData";
  const apiKey = pm.collectionVariables.get("API_Key");
  const saltKey = pm.collectionVariables.get("SaltKey");
  const requestBody = pm.request.body;
  console.log("requestBody",requestBody);
  console.log("mode:" + requestBody.mode);
  let body = {};
  if(requestBody.mode == "formdata"){
      const formdata = requestBody.formdata.members;
      body = convertFormDataToJson(formdata)
      requestBody.formdata.members.add("data",body)
  }else{
      body = JSON.parse(requestBody.raw);
  }

  const bodyJson = JSON.stringify(body);
  console.log("~~~~~~~~~bodyJson :" + bodyJson);

  const content = "ts="+ timestamp+"&data=" + bodyJson.toLowerCase() + "&sk=" + saltKey;
  console.log("apiKey: " , apiKey);
  console.log("timestamp: ", timestamp);
  console.log("body: ", body);
  console.log("saltKey: ", saltKey);
  console.log("content: ", content);
  pm.sendRequest({
      url: signatureApiUrl,
      method: 'POST',
      header: {
          'Content-Type': 'multipart/form-data'
      },
      body: {
          mode: 'formdata',
          formdata: [
              { key: "content", value: content, type: "text" },
              { key: "key", value: apiKey, type: "text" }
          ]
      }}, function (err, response) {
      const responseBody = response.json();
      pm.collectionVariables.set("Signature", responseBody.Data);
  });

