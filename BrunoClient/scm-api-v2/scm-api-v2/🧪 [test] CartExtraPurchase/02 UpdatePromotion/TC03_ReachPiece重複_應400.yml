info:
  name: TC03_ReachPiece重複_應400
  type: http
  seq: 3

meta:
  purpose: |-
    【負向】UpdatePromotion 時傳入重複 ReachPiece（2, 2）。
    與 CreatePromotion TC03 對稱驗證，UpdatePromotion Validator 也應擋下。
    預期：400。

http:
  method: POST
  url: "{{base-url}}/Promotion/UpdatePromotion?t={{token}}&ts={{timestamp}}&s={{signature}}"
  params:
    - name: t
      value: "{{token}}"
      type: query
    - name: ts
      value: "{{timestamp}}"
      type: query
    - name: s
      value: "{{signature}}"
      type: query
  body:
    type: json
    data: |-
      {
        "Id": {{promotionId}},
        "ShopId": 10230,
        "TypeDef": "CartReachPieceExtraPurchase",
        "Name": "[U03]ReachPiece重複",
        "StartDateTime": "2029-06-01T00:00:00.000Z",
        "EndDateTime": "2029-06-30T23:59:59.000Z",
        "Description": "TC-U03",
        "CustomCampaignCode": "TEST",
        "CanUseECoupon": false,
        "IsCartExtraPurchaseThresholdEligible": true,
        "TargetMemberTypeDef": "All",
        "PromotionTargetRegionTypeDef": "All",
        "IsCyclable": false,
        "ExtraPurchaseRuleList": [
          { "ConditionId": 1, "ReachPiece": 2, "ReachPrice": 0, "LimitQty": 10 },
          { "ConditionId": 2, "ReachPiece": 2, "ReachPrice": 0, "LimitQty": 5 }
        ],
        "TargetTypeDef": "SalePage",
        "ExcludeTargetTypeDef": "None",
        "CalculateTypeDef": "Compatible",
        "TargetPlatformTypeList": [
          { "Platform": "Web", "IsEnabled": true },
          { "Platform": "AppIOS", "IsEnabled": true },
          { "Platform": "AppAndroid", "IsEnabled": true }
        ]
      }
  auth: inherit

tests: |-
  test("TC-U03 ReachPiece 重複應被擋下（預期 400）", function () {
    expect(res.getStatus()).to.equal(400);
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5