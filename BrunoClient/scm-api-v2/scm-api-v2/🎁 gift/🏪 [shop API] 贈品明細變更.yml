info:
  name: 🏪 [shop API] 贈品明細變更
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url}}/scm/V2/Gift/UpdateDetail?t={{token}}&ts={{timestamp}}&s={{signature}}"
  params:
    - name: t
      value: "{{token}}"
      type: query
    - name: ts
      value: "{{timestamp}}"
      type: query
    - name: s
      value: "{{signature}}"
      type: query
  body:
    type: json
    data: |-
      {
          "ShopId": 2,
          "Id": 61648,
          "Title": "贈品名稱(改一下)",
          "OuterId": "RX-78(改一下)",
          "ShortContent": "贈品特色(改一下)",
          "SafetyStockQty": 30,
          "StockQty": 500,
          "TemperatureTypeDef": "Normal",
          "ShippingTypes": [
              260
          ],
          "PayTypes": [
              "QFPay",
              "ApplePay",
              "GooglePay"
          ],
          "Length": 10,
          "Width": 10,
          "Height": 10,
          "Weight": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
