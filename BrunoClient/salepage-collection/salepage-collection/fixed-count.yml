info:
  name: fixed-count
  type: http
  seq: 2

http:
  method: GET
  url: "{{base-url}}/api/fixed-salepage-collections/{{collectionId}}:count?countType=Accurate"
  headers:
    - name: N1-SHOP-ID
      value: "{{shopId}}"
    - name: N1-TRACE-ID
      value: "{{traceId}}"
  params:
    - name: countType
      value: Accurate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
