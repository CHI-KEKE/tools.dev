opencollection: 1.0.0

info:
  name: salepage-collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: traceId
      value: "{{$guid}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
