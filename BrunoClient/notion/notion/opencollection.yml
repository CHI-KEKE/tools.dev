opencollection: 1.0.0

info:
  name: notion
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Notion-Version
      value: "{{version}}"
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: base-url
      value: https://api.notion.com/v1
    - name: version
      value: 2022-06-28
    - name: token
      value: 
    - name: page-id
      value: 42c13758-b4e6-43e9-8a31-4ff3d88b385e
    - name: db-id
      value: 2d44968c08514d5abd480ab8724d5cdf
    - name: block-id
      value: 42c13758-b4e6-43e9-8a31-4ff3d88b385e
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
