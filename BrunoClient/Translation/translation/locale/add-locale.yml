info:
  name: add-locale
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url}}/api/v3/projects/{{project-name}}/locales"
  body:
    type: json
    data: |-
      {
          "Locales":[
              {
                  "Locale":"th-TH"
              }
          ]
          
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
