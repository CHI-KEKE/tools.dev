info:
  name: get-checkout
  type: http
  seq: 8

http:
  method: GET
  url: "{{base-url}}/shopping/api/Checkout?lang=zh-TW&shopId={{shopId}}&checkoutUniqueKey={{k}}"
  headers:
    - name: N1-SHOP-ID
      value: "{{shopId}}"
    - name: Cookie
      value: "{{Cookie}}"
    - name: N1-HOST
      value: "{{host}}"
  params:
    - name: lang
      value: zh-TW
      type: query
    - name: shopId
      value: "{{shopId}}"
      type: query
    - name: checkoutUniqueKey
      value: "{{k}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
