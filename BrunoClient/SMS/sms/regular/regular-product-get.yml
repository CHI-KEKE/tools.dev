info:
  name: regular-product-get
  type: http
  seq: 2

http:
  method: GET
  url: "{{base-url}}/Api/RegularProduct/GetDetail?shopId={{shopId}}&planId={{planId}}"
  headers:
    - name: Cookie
      value: "{{Cookie}}"
  params:
    - name: shopId
      value: "{{shopId}}"
      type: query
    - name: planId
      value: "{{planId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
